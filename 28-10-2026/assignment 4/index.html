
<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <h1>Amazon</h1>
    <p class="subtitle">Best Sale on Apple products</p>

    <div class="products">

        <div class="card">
            <img src="headphones.png" alt="Headphones">
            <h2>Wireless Headphones</h2>
            <p>Comfortable headphones with rich sound and long battery life.</p>
            <h3>₹79,000</h3>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="smartphone.png" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>A fast smartphone with a bright display and a powerful camera.</p>
            <h3>₹89,000</h3>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="smartwatch.png" alt="Smartwatch">
            <h2>Smartwatch</h2>
            <p>Track your fitness and get notifications on your wrist.</p>
            <h3>₹1,67,899</h3>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
